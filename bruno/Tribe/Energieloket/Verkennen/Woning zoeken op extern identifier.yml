docs:
  content: |
    Zoekt een Woning op een extern identifier dat niet bestaat. Met een spatie na e: gaf Tribe 400 "The URI is malformed"; deze variant is zonder spatie.
    Een lege value-lijst betekent dat Tribe deze filter ondersteunt; een fout betekent dat het zo niet kan. Nodig voor de keuze hoe opnieuw verwerken veilig wordt.
