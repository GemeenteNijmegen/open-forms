info:
  name: Extern identifier zoeken op Id
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}ExternalId?$select=ID,Service,Type&$filter=Id eq 'OF-TEST-0000'&$expand=Entity($select=ID)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Zoekt het extern identifier zelf op zijn Id, met het record waar het aan hangt. Alternatief voor zoeken via de Woning.
    Draai hem twee keer: met OF-TEST-0000 (verwacht een lege lijst) en tijdelijk met een Id uit Filtercontrole extern identifier (verwacht precies dat record).
    Commit die tweede waarde niet. Werken beide, dan kan de koppeling hiermee een eerder aangemaakt record terugvinden.
  type: text/markdown
