info:
  name: Notitie aan een record
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}Note?$top=3&$select=ID,CreationDate&$expand=Entity($select=ID)"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Drie notities met alleen hun ID, datum en het ID van het record waar ze aan hangen. Laat zien hoe een notitie aan een Woning of VvE gekoppeld is.
  type: text/markdown
