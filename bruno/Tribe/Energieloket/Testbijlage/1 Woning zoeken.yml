info:
  name: 1 Woning zoeken
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}ExternalId?$select=Type,Id&$filter=Id eq '{{inwonerReferentie}}' and Type eq 'Energieloket.Woning'&$expand=Entity($select=ID)"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const url = decodeURIComponent(req.getUrl());
        const match = url.match(/Id eq '([^']*)'/);
        let ref = match ? match[1] : '';
        if (ref.includes('{{')) ref = bru.getVar('inwonerReferentie') || '';
        if (!ref) {
          console.log('[1 Woning zoeken] MISLUKT geen testreferentie: vervang in de URL {{inwonerReferentie}} door de testreferentie');
          bru.runner.stopExecution();
        } else {
          bru.setVar('inwonerReferentie', ref);
        }
    - type: after-response
      code: |-
        const hit = ((res.body && res.body.value) || [])[0];
        if (hit && hit.Entity) {
          bru.setVar('inwonerWoningId', hit.Entity.ID);
          console.log('[1 Woning zoeken] OK', hit.Entity.ID);
        } else {
          console.log('[1 Woning zoeken] MISLUKT geen woning met deze testreferentie', res.status, JSON.stringify(res.body));
          bru.runner.stopExecution();
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Zoekt de Woning van de testrun op zijn identifier.
  type: text/markdown
