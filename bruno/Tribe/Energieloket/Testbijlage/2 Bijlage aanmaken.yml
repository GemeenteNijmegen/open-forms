info:
  name: 2 Bijlage aanmaken
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}Attachment"
  body:
    type: json
    data: |-
      {
        "Description": "TEST bijlage {{inwonerReferentie}}",
        "Entity": {
          "ID": "{{inwonerWoningId}}"
        },
        "File": {
          "Name": "TEST-bijlage.pdf",
          "MimeType": "application/pdf",
          "Data": ""
        },
        "ExternalIds": [
          {
            "Service": "OpenForms",
            "Type": "Energieloket.Bijlage",
            "Id": "{{inwonerReferentie}}"
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const id = res.body && res.body.ID;
        if (res.status >= 200 && res.status < 300 && id) {
          bru.setVar('inwonerBijlageId', id);
          console.log('[2 Bijlage aanmaken] OK', res.status, 'inwonerBijlageId =', id);
        } else {
          console.log('[2 Bijlage aanmaken] MISLUKT', res.status, JSON.stringify(res.body));
          bru.runner.stopExecution();
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Hangt de pdf aan de Woning, met identifier (Type Energieloket.Bijlage). De pdf staat als base64 in Data en bevat alleen de testtekst.
  type: text/markdown
