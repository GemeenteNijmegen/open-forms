info:
  name: 3 Bijlagen ophalen
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}_8e7ed9fb__a892__4cf1__9402__2428fcbc8022({{inwonerWoningId}})?$select=ID&$expand=Attachments($select=ID,Description,Size;$expand=File($select=Name,MimeType,Url),ExternalIds($select=Type,Id))"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const list = (res.body && res.body.Attachments) || [];
        const hit = list.find(a => a.ID === bru.getVar('inwonerBijlageId'));
        console.log('[3 Bijlagen ophalen]', res.status, hit ? 'OK bijlage hangt aan woning' : 'LET OP bijlage niet gevonden', JSON.stringify(hit || list));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Haalt de bijlagen van de Woning op, met naam, type, grootte en identifier van het bestand.
  type: text/markdown
