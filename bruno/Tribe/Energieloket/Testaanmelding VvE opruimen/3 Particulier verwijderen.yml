info:
  name: 3 Particulier verwijderen
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}Relationship_Person_Private({{vveParticulierId}})"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar('vveParticulierId')) {
          console.log('[3 Particulier verwijderen] overgeslagen, geen vveParticulierId');
          bru.runner.skipRequest();
        }
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300) {
          console.log('[3 Particulier verwijderen] OK', res.status, bru.getVar('vveParticulierId'));
        } else if (res.status === 404) {
          console.log('[3 Particulier verwijderen] OK was al verwijderd', bru.getVar('vveParticulierId'));
        } else {
          console.log('[3 Particulier verwijderen] MISLUKT', res.status, JSON.stringify(res.body));
        }
        if (res.status < 300 || res.status === 404) bru.setVar('vveParticulierId', '');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Verwijdert het record uit vveParticulierId.
  type: text/markdown
