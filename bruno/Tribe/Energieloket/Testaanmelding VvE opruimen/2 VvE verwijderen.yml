        if (res.status >= 200 && res.status < 300) {
          console.log('[2 VvE verwijderen] OK', res.status, bru.getVar('vveVveId'));
        } else if (res.status === 404) {
          console.log('[2 VvE verwijderen] OK was al verwijderd', bru.getVar('vveVveId'));
        } else {
          console.log('[2 VvE verwijderen] MISLUKT', res.status, JSON.stringify(res.body));
        }
        if (res.status < 300 || res.status === 404) bru.setVar('vveVveId', '');

