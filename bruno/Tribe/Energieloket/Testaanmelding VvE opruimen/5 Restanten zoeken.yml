info:
  name: 5 Restanten zoeken
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}ExternalId?$select=ID,Type,Id&$filter=Id eq '{{vveReferentie}}'"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const left = (res.body && res.body.value) || [];
        if (!bru.getVar('vveReferentie')) {
          console.log('[5 Restanten zoeken] LET OP geen testreferentie, niets gecontroleerd');
        } else {
          console.log('[5 Restanten zoeken]', left.length === 0 ? 'OK geen identifiers meer met ' + bru.getVar('vveReferentie') + ': ze zijn met hun records verwijderd' : 'LET OP nog ' + left.length + ' identifiers, de volgende stappen ruimen ze op', JSON.stringify(left));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Zoekt of er nog externe identifiers met de testreferentie zijn. Laat zien of Tribe identifiers met hun record verwijdert.
  type: text/markdown
