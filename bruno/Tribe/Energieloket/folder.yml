info:
  name: Energieloket
  type: folder
  seq: 2

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: "{{tokenUrl}}"
    credentials:
      clientId: "{{energieloketClientId}}"
      clientSecret: "{{energieloketClientSecret}}"
      placement: body
    scope: read write offline
    tokenConfig:
      id: energieloket
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: true

docs:
  content: |
    ## Energieloket

    Requests naar de Tribe-omgeving van het Energieloket, met eigen client credentials: energieloketClientId en energieloketClientSecret in de omgeving Tribe.
    Hoe de authenticatie en de healthcheck werken, staat in de docs van de collectie.

    Anders dan bij Autodelen post de koppeling niet op één formulier, maar maakt hij losse records aan: een Persoon, de rol Particulier, een Woning of VvE en een notitie.
    Wat er in Tribe komt, staat in docs/Tribe/Energieloket.md in de repo.

    ## Keuzelijsten

    De map Keuzelijsten haalt de keuzes op die de mapping gebruikt, zoals woningtype en verwarmingssysteem.
    Net als bij Autodelen gaat in een POST de ID mee, niet de tekst in _Name. Een antwoord dat niet in een lijst past, stuurt de koppeling als tekst mee.

    ## Testen

    Er is één Tribe-omgeving voor het Energieloket, ook voor acceptatie. Alles wat je hier post, komt dus in de echte omgeving van het loket.
    Gebruik alleen verzonnen gegevens met TEST in de naam, en laat een notitie beginnen met TEST ACCEPTATIE.

    Deze collectie staat in een publieke repo: geen client-ID, secret, token of echte persoonsgegevens in een request, voorbeeld of opgeslagen response.
  type: text/markdown
