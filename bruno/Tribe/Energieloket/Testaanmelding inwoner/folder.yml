docs:
  content: |
    ## Wat het doet

    Maakt in de echte Tribe-omgeving van het Energieloket een testaanmelding van een inwoner aan, in de vorm die de koppeling waarschijnlijk krijgt: elk record krijgt in dezelfde POST een extern identifier met de testreferentie en de stap (Energieloket.Persoon, .Particulier, .Woning, .Notitie). Zo kan opnieuw verwerken per stap vinden wat er al is.

    1. Persoon aanmaken, met adres, identifier en de Particulier in dezelfde POST. Maakt eerst een unieke testreferentie OF-TEST-jjjjmmdduumm. Alleen zo krijgt de Particulier een naam.
    2. Persoon ophalen: hangen adres, identifiers en Particulier eraan, en hebben persoon en Particulier een naam?
    3. Woning aanmaken, met de Particulier in Individual persons, Adres als titel en identifier.
    4. Woning ophalen: hangt de Particulier eraan, hebben Woning en Particulier een titel?
    5. Notitie aan de Woning, met identifier.
    6. Alle identifiers met de testreferentie zoeken: vier, elk naar het juiste record?
    7. Herverwerking nabootsen: zoek het identifier van de persoon zoals de koppeling dat zou doen.

    Alle gegevens zijn verzonnen (TEST, test@example.org, 0000000000, 0000AA). Op 27-11-2026 staan er geen automations aan.

    ## Draaien

    1. Kies rechtsboven de omgeving Tribe.
    2. Open de console: Cmd + Option + I (of View > Toggle Developer Tools), tabblad Console. Typ [ in het filterveld om alleen de regels van deze map te zien.
    3. Klik met de rechtermuisknop op deze map (of de drie puntjes) en kies Run. Klik in de Runner op Run Collection.
    4. Elke stap logt [stap] OK, LET OP of MISLUKT. Bij MISLUKT stopt de run; de foutmelding staat in de console en in de response van die stap.
    5. Ruim direct daarna op met de opruimmap eronder, in hetzelfde Bruno-venster. Ook als de run halverwege stopte.

    Per stap kan ook: klik op de stap en druk Cmd + Enter, op volgorde.

    Opruimen: map Testaanmelding inwoner opruimen.
  type: text/markdown
