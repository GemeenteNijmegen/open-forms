info:
  name: 2 Naam persoon ophalen
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}Relation_Person({{inwonerPersoonId}})?$select=ID,Name,SortName"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar('inwonerPersoonNaam', res.body.Name || '');
        bru.setVar('inwonerPersoonSortNaam', res.body.SortName || '');
        console.log('[2 Naam persoon ophalen]', res.status, 'Name =', res.body.Name, '| SortName =', res.body.SortName);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Haalt de naam op die Tribe voor de persoon heeft ingevuld.
  type: text/markdown
