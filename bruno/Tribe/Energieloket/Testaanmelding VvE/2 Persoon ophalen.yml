info:
  name: 2 Persoon ophalen
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}Relation_Person({{vvePersoonId}})?$select=ID,Name,SortName&$expand=ExternalIds($select=ID,Type,Id),Person($select=ID,Name,SortName;$expand=ExternalIds($select=Type,Id))"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status !== 200) {
          console.log('[2 Persoon ophalen] MISLUKT', res.status, JSON.stringify(res.body));
          bru.runner.stopExecution();
        } else {
          const body = res.body;
          console.log('[2 Persoon ophalen]', ((body.ExternalIds || []).some(e => e.Id === bru.getVar('vveReferentie'))) ? 'OK identifier persoon' : 'LET OP geen identifier persoon');
          console.log('[2 Persoon ophalen]', (body.Name) ? 'OK naam persoon door Tribe ingevuld' : 'LET OP naam persoon leeg');
          console.log('[2 Persoon ophalen]', ((body.Person || []).some(r => r.ID && r.Name)) ? 'OK particulier aangemaakt met naam' : 'LET OP geen particulier met naam');
          console.log('[2 Persoon ophalen]', ((body.Person || []).some(r => (r.ExternalIds || []).some(e => e.Type === 'Energieloket.Particulier'))) ? 'OK identifier particulier' : 'LET OP geen identifier particulier');
          const roles = body.Person || [];
          const part = roles.find(r => (r['@odata.type'] || '').includes('Private')) || roles[0];
          if (part && part.ID) bru.setVar('vveParticulierId', part.ID);
          console.log('[2 Persoon ophalen] response', JSON.stringify(body));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs:
  content: |
    Controleert persoon en Particulier: adres, identifiers, en of Tribe beide een naam gaf. Zet vveParticulierId.
  type: text/markdown
